name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @roaster/web build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Non-blocking while the suite proves itself in CI (real wrangler dev + local D1
    # + browser). Flip continue-on-error off, and add e2e to `deploy`'s `needs`, once
    # it's been stable for a while.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Write .dev.vars for wrangler dev
        # wrangler dev reads local secrets/vars from .dev.vars (not process env) — see
        # .dev.vars.example for what each of these does.
        # The GOOGLE_* pair is dummy on purpose: createAuth (worker/src/auth.ts) throws if
        # either is absent, which 500s every request and makes Playwright time out waiting
        # for its webServer. The suite signs in over email OTP and never touches the Google
        # flow, so no real credential is needed — only a non-empty one.
        run: |
          cat > .dev.vars <<'EOF'
          BETTER_AUTH_SECRET=ci-test-secret-not-for-production-0000000
          DEV_OTP_FALLBACK=true
          BETTER_AUTH_URL=http://localhost:8787
          E2E_TEST_MODE=true
          GOOGLE_CLIENT_ID=ci-test-client-id-not-for-production
          GOOGLE_CLIENT_SECRET=ci-test-client-secret-not-for-production
          EOF
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
