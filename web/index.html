<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Cabin-crew roster app: enter trips fast, report-time-first, family follows along." />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fafafa'/%3E%3Ccircle cx='32' cy='28' r='12' fill='%232f6fed'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Roaster Me</title>
    <style>
      html,
      body {
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <!-- Pre-JS splash: React's createRoot().render() clears #root's children on first render,
         so this markup is replaced automatically — nothing to remove by hand. Styles are inline
         (not in styles.css) so this paints on the first frame, before any stylesheet round trip.
         Colours are copied from tokens.css's --color-ground light/dark values rather than reading
         the CSS variable, since tokens.css hasn't loaded yet either. -->
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #fafafa;
          color: #1b1d22;
        "
      >
        <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">roaster·me</span>
        <span
          style="
            width: 24px;
            height: 24px;
            border-radius: 999px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            opacity: 0.5;
            animation: splash-spin 0.9s linear infinite;
          "
        ></span>
      </div>
    </div>
    <style>
      @media (prefers-color-scheme: dark) {
        #root > div {
          background: #15171c !important;
          color: #e8ebf1 !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root > div span[style*="animation"] {
          animation: none !important;
        }
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
