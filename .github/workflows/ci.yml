name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @danyeowa/web build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Blocking as of 2026-08-11. It was non-blocking "until the suite proves itself", which it
    # now has: 18 consecutive green runs across the card redesign, the inline-add rework, the
    # sheet deletion and the timeline. The long red streak before that was never flakiness — it
    # was the GOOGLE_CLIENT_SECRET boot bug, which stopped the worker starting at all.
    # Playwright retries once (see e2e/playwright.config.ts), so a genuine blip self-heals.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Write .dev.vars for wrangler dev
        # wrangler dev reads local secrets/vars from .dev.vars (not process env) — see
        # .dev.vars.example for what each of these does.
        # The GOOGLE_* pair is dummy on purpose: createAuth (worker/src/auth.ts) throws if
        # either is absent, which 500s every request and makes Playwright time out waiting
        # for its webServer. The suite signs in over email OTP and never touches the Google
        # flow, so no real credential is needed — only a non-empty one.
        run: |
          cat > .dev.vars <<'EOF'
          BETTER_AUTH_SECRET=ci-test-secret-not-for-production-0000000
          DEV_OTP_FALLBACK=true
          BETTER_AUTH_URL=http://localhost:8787
          E2E_TEST_MODE=true
          GOOGLE_CLIENT_ID=ci-test-client-id-not-for-production
          GOOGLE_CLIENT_SECRET=ci-test-client-secret-not-for-production
          EOF
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        # always(), not failure(): this job is continue-on-error, so a failed suite still reports
        # the job as successful and failure() never fires — meaning the report was missing in
        # exactly the case it exists for.
        #
        # test-results/ is where the evidence actually lives: per-test error-context.md (the
        # page snapshot at the moment of failure) and trace.zip. playwright-report/ is only
        # written by the html reporter, and this suite runs the list reporter — so that path
        # matched nothing and every upload logged "No files were found", leaving CI-only
        # failures with no artifact to read. Both paths are listed so adding the html
        # reporter later doesn't silently drop it again.
        if: always()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Every PR gets its own throwaway URL, so a change can be looked at on a real phone —
  # over HTTPS, so installing to the home screen and Google sign-in both behave — without
  # anyone running a dev server. `versions upload` publishes a version WITHOUT promoting it:
  # production keeps serving whatever `deploy` last shipped.
  #
  # The preview binds the SAME D1 as production (a version carries the Worker's real
  # bindings), so anything added or deleted through a preview URL is real roster data.
  preview:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @danyeowa/web build
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler versions upload 2>&1 | tee upload.log
          # Wrangler prints the version preview URL on its own line; take the first
          # workers.dev URL it emits. Empty output means the URL format moved — fail loudly
          # rather than comment a broken link.
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::no preview URL found in wrangler output — see upload.log above"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ github.event.number }}
        run: |
          body=$(printf '**Preview:** %s\n\nBuilt from %s. Uses the production D1, so trips added or deleted here are real.' "$URL" "${GITHUB_SHA::7}")
          # Edit this job's own previous comment when there is one, so a busy PR keeps a
          # single up-to-date link instead of a column of stale ones.
          gh pr comment "$PR" --edit-last --body "$body" || gh pr comment "$PR" --body "$body"

  deploy:
    # Production waits for the browser suite too. Unit tests and typecheck cannot see the class
    # of bug that actually reaches users here — layout collapsing at phone width, a flow that
    # no longer completes — so deploying on `check` alone was shipping past the only gate that
    # would catch them.
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Schema BEFORE code, always. A migration applied by hand after its code shipped is a
      # coin flip: three of them landed that way and only stayed safe because they were
      # additive. wrangler applies only what `d1_migrations` has not recorded, so this is a
      # no-op on a run with nothing new.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply danyeowa-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Build and deploy are SEPARATE steps on purpose. `pnpm run deploy` is
      # `build && wrangler deploy`, and pnpm does not forward `--` arguments into a chained
      # command — they are silently dropped, so `pnpm run deploy -- --var …` deploys with no
      # BUILD_SHA at all and the smoke check below can never pass. (Measured: the same call with
      # `--dry-run` appended deployed for real.)
      - run: pnpm build
      # BUILD_SHA is what makes the smoke check decisive. Passed at deploy rather than written
      # into wrangler.jsonc, because the value is different on every run.
      - run: npx wrangler deploy --var BUILD_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A green deploy job is NOT evidence the new code serves. After #53 merged, this job was
      # green while production still queried a table the migration had dropped, and nothing
      # noticed until it was found by hand. Both halves are checked, because they fail
      # separately: the Worker (does /api/health report THIS commit) and the static assets
      # (does the page reference the bundle this run just built).
      #
      # Retried, not one-shot: a request made mid-propagation gets the PREVIOUS version and
      # looks exactly like a failed deploy. The check has to outlast that window before it is
      # allowed to fail, or it becomes the flake it was meant to catch.
      - name: Verify production serves this build
        run: |
          set -uo pipefail
          BUNDLE="$(basename "$(ls web/dist/assets/index-*.js | head -1)")"
          echo "expecting worker $GITHUB_SHA and bundle $BUNDLE"
          for attempt in $(seq 1 20); do
            SERVED_SHA="$(curl -fsS --max-time 10 https://danyeowa.com/api/health \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
            if [ "$SERVED_SHA" = "$GITHUB_SHA" ] && curl -fsS --max-time 10 https://danyeowa.com/ | grep -q "$BUNDLE"; then
              echo "production serves $GITHUB_SHA and $BUNDLE (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: worker=${SERVED_SHA:-none}"
            sleep 15
          done
          echo "::error::production did not serve $GITHUB_SHA / $BUNDLE within 5 minutes"
          curl -fsS https://danyeowa.com/api/health || true
          curl -fsS https://danyeowa.com/ | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true
          exit 1
        env:
          GITHUB_SHA: ${{ github.sha }}
